<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotina do Adrian</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101522'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23F0B429' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#101522; --surface:#171E30; --surface-2:#1E2739; --line:#2A3449;
    --ink:#E9ECF5; --ink-2:#A8B2C8; --ink-3:#6F7C96;
    --fac:#F0B429; --eng:#3DD6C4; --late:#FF6B6B;
    --display:Candara,Optima,"Segoe UI",system-ui,sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
    --r:12px;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F7F8FC; --line:#DDE1EC;
           --ink:#171E30; --ink-2:#4C5770; --ink-3:#8C96AC; --fac:#B57C00; --eng:#128A7B; --late:#D63A3A; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:48px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  a{color:inherit}

  header{padding:28px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0}
  h1{font-family:var(--display);font-size:clamp(26px,4.6vw,36px);font-weight:700;letter-spacing:-.02em;margin:4px 0 0;line-height:1.05}
  .entrar{display:flex;gap:6px;flex-wrap:wrap}
  .entrar a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
    background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .entrar a:hover{color:var(--ink);border-color:var(--ink-3)}

  h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:28px 0 10px}

  /* hoje */
  .hoje{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 10px;margin-top:18px}
  .hoje .titulo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0 4px;flex-wrap:wrap}
  .hoje .titulo b{font-family:var(--display);font-size:21px;letter-spacing:-.01em}
  .hoje .titulo span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .folga{color:var(--ink-2);padding:6px 0 10px;margin:0}
  .atras{margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
  .atras p{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--late);margin:4px 0 2px}

  /* prazos */
  .prazos{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .prazo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
  .prazo .d{font-family:var(--mono);font-size:15px;font-weight:700}
  .prazo .o{font-size:12px;color:var(--ink-2);display:block;line-height:1.3;margin-top:2px}
  .prazo .f{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block;margin-top:4px}
  .prazo.prox{border-color:var(--fac)}
  .prazo.prox .f{color:var(--fac)}
  .prazo.ok{opacity:.45}

  /* tarefa */
  ul.ts{list-style:none;margin:0;padding:0}
  li.t{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  li.t:first-child{border-top:0}
  li.t input{appearance:none;flex:0 0 auto;width:20px;height:20px;margin:0;cursor:pointer;border:1.5px solid var(--ink-3);border-radius:6px;position:relative;background:transparent}
  li.t input:checked{background:var(--cor);border-color:var(--cor)}
  li.t input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(42deg)}
  li.t input:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--fac);outline-offset:2px}
  li.t .c{flex:1;min-width:0}
  li.t .n{display:block;font-size:15px;cursor:pointer}
  li.t .s{display:block;font-size:12px;color:var(--ink-3)}
  li.t .s::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cor);margin-right:6px;vertical-align:1px}
  li.t .s em{font-style:normal;color:var(--late);font-weight:600}
  li.t.feito .n{text-decoration:line-through;color:var(--ink-3)}
  li.t.feito .btn{opacity:.5}
  li.t .acoes{display:flex;gap:6px;flex:0 0 auto}
  .btn{text-decoration:none;white-space:nowrap;font-size:13px;font-weight:600;border-radius:8px;padding:7px 12px;
    background:var(--cor);color:var(--bg);border:1px solid var(--cor)}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:transparent;color:var(--ink-2);border-color:var(--line);font-weight:500}
  .btn.sec:hover{border-color:var(--ink-3);color:var(--ink)}

  /* cronograma */
  details.sem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
  details.sem[open]{border-color:var(--ink-3)}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 16px}
  summary::-webkit-details-marker{display:none}
  summary .num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-2);width:26px}
  summary .tt{flex:1;min-width:0}
  summary .tt b{display:block;font-size:15px;font-weight:600}
  summary .tt span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  summary .cont{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  summary .cont.tudo{color:var(--fac)}
  details.sem.atual summary .num{color:var(--fac)}
  .corpo{padding:0 16px 10px}
  .dia{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 2px}

  footer{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  footer button{background:none;border:0;padding:0;color:var(--ink-3);font:inherit;text-decoration:underline;cursor:pointer}
  footer button:hover{color:var(--ink)}

  @media (max-width:640px){
    .prazos{grid-template-columns:repeat(2,1fr)}
    li.t{flex-wrap:wrap}
    li.t .acoes{width:100%;padding-left:32px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <p class="eyebrow" id="data">—</p>
    <h1>Rotina do Adrian</h1>
  </div>
  <div class="entrar">
    <a href="https://portaldoaluno.fatecie.edu.br/login" target="_blank" rel="noopener">Entrar na faculdade</a>
    <a href="https://student.openenglish.com/login.html" target="_blank" rel="noopener">Entrar no inglês</a>

</header>

<section class="hoje" id="hoje"></section>

<h2>Prazos da faculdade</h2>

<div id="crono"></div>

<footer>
  <span id="salvo">—</span>

</footer>

</div>
<script>
(function(){
"use strict";

var M = "https://www.eadunifatecie.com.br";
var OE = "https://student.openenglish.com";
var YT = "https://www.youtube.com/watch?v=";

var DISC = {
  intro:{nome:"Introdução ao Curso", cor:"fac"},
  ia:   {nome:"Introdução à IA", cor:"fac"},
  arq:  {nome:"Arquitetura de Computadores", cor:"fac"},
  pln:  {nome:"PLN e IA", cor:"fac"},
  oe:   {nome:"Open English", cor:"eng"}
};

/* links que abrem a coisa em si, conferidos no Moodle e no Open English em 27/10/2026 */
function pdf(id){ return M+"/mod/resource/view.php?id="+id+"&redirect=1"; }
function url(id){ return M+"/mod/url/view.php?id="+id+"&redirect=1"; }
function quiz(id){ return M+"/mod/quiz/view.php?id="+id; }
function forum(id){ return M+"/mod/forum/view.php?id="+id; }
function enviarApa(id){ return M+"/mod/assign/view.php?id="+id+"&action=editsubmission"; }
function verApa(id){ return M+"/mod/assign/view.php?id="+id; }
function enquete(id){ return M+"/mod/feedback/complete.php?id="+id; }
function licao(id){ return OE+"/learning/lesson.html?q="+btoa("courseId="+id+"&lessonType=MINI_LESSON"); }

var VIDEO = {
  ia: ["U1CtdPEQjvk","nTVaB-uRPmY","nhw5Y7jVnHY","X8YkMAfio98","wT2Vxh9jMc4","2BYeQbcjYjI","2ny9-frm7No","Ptvwj20TLCw"],
  arq:["YcrHwmUcYxA","DDcMQY5CJfM","-XFIg5px3eM","dlHVt12yiWA","53_dXHwVyOE","-3gAA7c96aU","lo_FCIpn8GQ","ai99N7DhpDg"]
};
var SLIDE = {
  ia: [4207708,4207711,4207714,4207717,4207721,4207724,4207727,4207730],
  arq:[4205632,4205635,4205638,4205641,4205645,4205648,4205651,4205654]
};
var LIVE_PLN = ["tY44n3v4YMc","4rVzkVR6Cag","SsgBvq19pkw","A4hknPFBv94","lu4vZ1GhOFE"];

/* id = chave das marcações salvas: nao renomear os que ja existem */
function aula(d, n){
  return {id:d+"-aula"+n, nome:"Videoaula 0"+n, disc:d,
          a:[["Assistir", YT+VIDEO[d][n-1]], ["Slide", pdf(SLIDE[d][n-1])]]};
}
function live(n){
  return {id:"pln-live"+n, nome:"Live 0"+n, disc:"pln", a:[["Assistir", YT+LIVE_PLN[n-1]]]};
}

/* lições da Unidade 1 que faltam (ids da API do Open English) */
var LICOES = [
  [41998,"What Is Your Name? — parte 3"],[41999,"What Is Your Job? — parte 1"],
  [42000,"What Is Your Job? — parte 2"],[42001,"What Is Your Job? — parte 3"],
  [42002,"Where Are You From? — parte 1"],[42003,"Where Are You From? — parte 2"],
  [42004,"Where Are You From? — parte 3"],[42005,"Yes! — parte 1"],
  [42006,"Yes! — parte 2"],[42007,"Yes! — parte 3"],
  [42008,"Revisão da Unidade 1"],[42009,"Quiz da Unidade 1"]
];
function ingles(n){
  function li(k, slot){
    var l = LICOES[(n-1)*2 + slot];
    if (l) return {id:"en"+n+"-licao"+(slot+1), nome:"Lição: "+l[1], disc:"oe", a:[["Começar", licao(l[0])]]};
    return {id:"en"+n+"-licao"+(slot+1), nome:"Próxima lição (Unidade 2)", disc:"oe", a:[["Abrir", OE+"/#lp2-lesson-carousel"]]};
  }
  return {
    seg:[ li(n,0) ],
    qua:[ li(n,1),
          {id:"en"+n+"-pratica", nome:"Prática de pronúncia — clique no card “Em andamento”", disc:"oe", a:[["Abrir", OE+"/#lp2-practice-section"]]} ],
    sab:[ {id:"en"+n+"-live", nome:"Aula ao vivo em grupo — escolha um horário", disc:"oe", a:[["Abrir", OE+"/#lp2-live-class-carousel"]]} ]
  };
}

var SEMANAS = [
  {de:"2026-11-02", titulo:"Introdução à IA — aulas 1 a 4", fac:{
    ter:[aula("ia",1), aula("ia",2)], qui:[aula("ia",3), aula("ia",4)],
    sab:[{id:"ia-apostila", nome:"Apostila de Introdução à IA", disc:"ia", a:[["Abrir", url(4207702)]]},
         {id:"i-apostila", nome:"Apostila da disciplina", disc:"intro", a:[["Abrir", url(3860234)]]},
         {id:"i-slides", nome:"Slides de introdução ao curso", disc:"intro", a:[["Abrir PDF", pdf(3860235)]]}]
  }},
  {de:"2026-11-09", titulo:"Introdução à IA — aulas 5 a 8", fac:{
    ter:[aula("ia",5), aula("ia",6)], qui:[aula("ia",7), aula("ia",8)],
    sab:[{id:"ia-forum", nome:"Fórum: ler o tema e postar", disc:"ia", a:[["Postar", forum(4207733)]]},
         {id:"i-livro", nome:"Aulas de Conceitos e Ambientação", disc:"intro", a:[["Abrir", M+"/mod/book/view.php?id=3860244"]]},
         {id:"i-apost2", nome:"Apostila Conceitos e Ambientação", disc:"intro", a:[["Abrir PDF", pdf(3860240)]]}]
  }},
  {de:"2026-11-16", titulo:"Arquitetura — aulas 1 a 4", fac:{
    ter:[aula("arq",1), aula("arq",2)], qui:[aula("arq",3), aula("arq",4)],
    sab:[{id:"arq-apostila", nome:"Apostila de Arquitetura", disc:"arq", a:[["Abrir PDF", pdf(4205627)]]},
         {id:"i-trilha", nome:"Vídeos da trilha de aprendizagem", disc:"intro", a:[["Assistir", YT+"7RYVRy32bVA&list=PLMygX6qaUk9Ibq-bsQ9-Qusrc-2Y7_CgC"]]},
         {id:"i-forum", nome:"Fórum: ler o tema e postar", disc:"intro", a:[["Postar", forum(3860265)]]}]
  }},
  {de:"2026-11-23", titulo:"Arquitetura — aulas 5 a 8 e rascunho das APAs", fac:{
    ter:[aula("arq",5), aula("arq",6)], qui:[aula("arq",7), aula("arq",8)],
    sab:[{id:"arq-forum", nome:"Fórum: ler o tema e postar", disc:"arq", a:[["Postar", forum(4205657)]]},
         {id:"apa-ia-rasc", nome:"APA: ler o enunciado e escrever", disc:"ia", a:[["Ver enunciado", verApa(4207732)]]},
         {id:"apa-arq-rasc", nome:"APA: ler o enunciado e escrever", disc:"arq", a:[["Ver enunciado", verApa(4205656)]]}]
  }},
  {de:"2026-11-30", titulo:"Entregar APAs e A1", fac:{
    ter:[{id:"apa-ia-env", nome:"Enviar a APA", disc:"ia", prazo:"2026-12-02", a:[["Enviar", enviarApa(4207732)]]},
         {id:"apa-arq-env", nome:"Enviar a APA", disc:"arq", prazo:"2026-12-02", a:[["Enviar", enviarApa(4205656)]]}],
    qui:[{id:"a1-ia", nome:"A1 — Atividade de Estudo 01", disc:"ia", prazo:"2026-12-07", a:[["Fazer", quiz(4207719)]]},
         {id:"a1-arq", nome:"A1 — Atividade de Estudo 01", disc:"arq", prazo:"2026-12-07", a:[["Fazer", quiz(4205643)]]}],
    sab:[{id:"p-apostila", nome:"Apostila de PLN e IA", disc:"pln", a:[["Abrir", url(4445311)]]}, live(1), live(2)]
  }},
  {de:"2026-12-07", titulo:"A2 e as lives de PLN", fac:{
    ter:[{id:"a2-ia", nome:"A2 — Atividade de Estudo 02", disc:"ia", prazo:"2026-12-14", a:[["Fazer", quiz(4207734)]]},
         {id:"a2-arq", nome:"A2 — Atividade de Estudo 02", disc:"arq", prazo:"2026-12-14", a:[["Fazer", quiz(4205658)]]},
         {id:"p-regul", nome:"Regulamento das avaliações", disc:"pln", a:[["Abrir PDF", pdf(4445314)]]}],
    qui:[live(3), live(4), live(5)],
    sab:[{id:"rev-ia", nome:"Revisar: slides das 8 aulas", disc:"ia", a:[["Abrir", M+"/course/view.php?id=117670"]]},
         {id:"rev-arq", nome:"Revisar: slides das 8 aulas", disc:"arq", a:[["Abrir", M+"/course/view.php?id=117669"]]}]
  }},
  {de:"2026-12-14", titulo:"Provas (prazo final: segunda, 21/12)", fac:{
    ter:[{id:"enq-ia", nome:"Enquete — sem ela a prova não abre", disc:"ia", a:[["Responder", enquete(4207735)]]},
         {id:"prova-ia", nome:"Prova curricular (6 pontos)", disc:"ia", prazo:"2026-12-21", a:[["Fazer prova", quiz(4207736)]]},
         {id:"enq-arq", nome:"Enquete — sem ela a prova não abre", disc:"arq", a:[["Responder", enquete(4205659)]]},
         {id:"prova-arq", nome:"Prova curricular (6 pontos)", disc:"arq", prazo:"2026-12-21", a:[["Fazer prova", quiz(4205660)]]}],
    qui:[{id:"enq-pln", nome:"Enquete — sem ela a prova não abre", disc:"pln", a:[["Responder", enquete(4445317)]]},
         {id:"prova-pln", nome:"Prova curricular (10 pontos)", disc:"pln", prazo:"2026-12-21", a:[["Fazer prova", quiz(4445318)]]}],
    sab:[{id:"enquete", nome:"Enquete — sem ela a prova não abre", disc:"intro", a:[["Responder", enquete(3860266)]]},
         {id:"prova-intro", nome:"Prova curricular (10 pontos)", disc:"intro", prazo:"2026-12-21", a:[["Fazer prova", quiz(3860267)]]}]
  }}
];
SEMANAS.forEach(function(s, i){ s.n = i+1; s.eng = ingles(i+1); });

var PRAZOS = [
  {d:"2026-12-02", o:"Enviar as 2 APAs", ids:["apa-ia-env","apa-arq-env"]},
  {d:"2026-12-07", o:"A1 de IA e de Arquitetura", ids:["a1-ia","a1-arq"]},
  {d:"2026-12-14", o:"A2 de IA e de Arquitetura", ids:["a2-ia","a2-arq"]},
  {d:"2026-12-21", o:"As 4 provas curriculares", ids:["prova-ia","prova-arq","prova-pln","prova-intro"]},
  {d:"2027-01-08", o:"Substitutiva (só se precisar)", ids:[]}
];

var ORDEM = ["seg","ter","qua","qui","sex","sab","dom"];
var NOME_DIA = {seg:"Segunda",ter:"Terça",qua:"Quarta",qui:"Quinta",sex:"Sexta",sab:"Sábado",dom:"Domingo"};
var TEMPO = {seg:"30 min de inglês", ter:"1h de faculdade", qua:"30 min de inglês", qui:"1h de faculdade", sab:"1h30 de faculdade + 40 min de inglês"};
var MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function dt(iso){ var p=iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function soma(isoStr, dias){ var d=dt(isoStr); d.setDate(d.getDate()+dias); return iso(d); }
function curto(isoStr){ var d=dt(isoStr); return d.getDate()+" "+MES[d.getMonth()]; }
function diasAte(isoStr){ return Math.round((dt(isoStr) - dt(iso(new Date()))) / 86400000); }
var HOJE = iso(new Date());

/* todas as tarefas com a data do dia em que caem */
var TODAS = [];
SEMANAS.forEach(function(s){
  ORDEM.forEach(function(d, k){
    var data = soma(s.de, k);
    (s.eng[d]||[]).concat(s.fac[d]||[]).forEach(function(t){ t.data = data; t.dia = d; t.sem = s.n; TODAS.push(t); });
  });
});

/* marcações */
var CHAVE = "rotina-adrian-v1";
var estado;
try { estado = JSON.parse(localStorage.getItem(CHAVE)) || {feitos:{}, salvoEm:null}; }
catch(e){ estado = {feitos:{}, salvoEm:null}; }
function feito(id){ return !!estado.feitos[id]; }
function salvar(){
  estado.salvoEm = new Date().toISOString();
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch(e){}
}

function linha(t, mostrarData){
  var li = document.createElement("li");
  li.className = "t" + (feito(t.id) ? " feito" : "");
  li.style.setProperty("--cor", "var(--"+DISC[t.disc].cor+")");
  var cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = "cb-"+t.id+(mostrarData?"-h":""); cb.checked = feito(t.id);
  cb.setAttribute("aria-label", "Feito: "+t.nome);
  cb.addEventListener("change", function(){
    if (cb.checked) estado.feitos[t.id] = true; else delete estado.feitos[t.id];
    salvar(); render();
  });
  var c = document.createElement("div"); c.className = "c";
  var n = document.createElement("label"); n.className = "n"; n.htmlFor = cb.id; n.textContent = t.nome;
  var s = document.createElement("span"); s.className = "s";
  s.textContent = DISC[t.disc].nome + (mostrarData ? " · " + NOME_DIA[t.dia].toLowerCase() + ", " + curto(t.data) : "");
  if (t.prazo){
    var dd = diasAte(t.prazo), em = document.createElement("em");
    em.textContent = " · até " + curto(t.prazo) + (dd >= 0 ? " (" + dd + " dias)" : " (venceu)");
    s.appendChild(em);
  }
  c.appendChild(n); c.appendChild(s);
  var ac = document.createElement("div"); ac.className = "acoes";
  t.a.forEach(function(x, i){
    var a = document.createElement("a");
    a.className = "btn" + (i ? " sec" : ""); a.href = x[1]; a.target = "_blank"; a.rel = "noopener";
    a.textContent = x[0];
    ac.appendChild(a);
  });
  li.appendChild(cb); li.appendChild(c); li.appendChild(ac);
  return li;
}

function renderHoje(){
  var box = document.getElementById("hoje");
  box.innerHTML = "";
  var dHoje = ORDEM[(new Date().getDay()+6)%7];
  var deHoje = TODAS.filter(function(t){ return t.data === HOJE; });
  var atrasadas = TODAS.filter(function(t){ return t.data < HOJE && !feito(t.id); });

  var tit = document.createElement("div"); tit.className = "titulo";
  var b = document.createElement("b"), sp = document.createElement("span");
  b.textContent = "Hoje";
  sp.textContent = (HOJE < SEMANAS[0].de || !deHoje.length) ? "folga" : (TEMPO[dHoje] || "folga");
  tit.appendChild(b); tit.appendChild(sp); box.appendChild(tit);

  if (deHoje.length){
    var ul = document.createElement("ul"); ul.className = "ts";
    deHoje.forEach(function(t){ ul.appendChild(linha(t, false)); });
    box.appendChild(ul);
  } else {
    var prox = TODAS.filter(function(t){ return t.data > HOJE; })[0];
    var p = document.createElement("p"); p.className = "folga";
    p.textContent = HOJE < SEMANAS[0].de ? "A rotina começa segunda, " + curto(SEMANAS[0].de) + ". Até lá, descanso."
      : prox ? "Dia livre. Próximo estudo: " + NOME_DIA[prox.dia].toLowerCase() + ", " + curto(prox.data) + "."
      : "Semestre encerrado.";
    box.appendChild(p);
  }

  if (atrasadas.length){
    var at = document.createElement("div"); at.className = "atras";
    var pp = document.createElement("p"); pp.textContent = "Ficou para trás (" + atrasadas.length + ")";
    at.appendChild(pp);
    var ul2 = document.createElement("ul"); ul2.className = "ts";
    atrasadas.forEach(function(t){ ul2.appendChild(linha(t, true)); });
    at.appendChild(ul2); box.appendChild(at);
  }
}

function renderPrazos(){
  var box = document.getElementById("prazos");
  box.innerHTML = "";
  var marcado = false;
  PRAZOS.forEach(function(p){
    var ok = p.ids.length && p.ids.every(feito);
    var dd = diasAte(p.d);
    var el = document.createElement("div");
    el.className = "prazo" + (ok ? " ok" : "");
    if (!ok && !marcado && dd >= 0){ el.className += " prox"; marcado = true; }
    el.innerHTML = '<span class="d"></span><span class="o"></span><span class="f"></span>';
    el.children[0].textContent = curto(p.d);
    el.children[1].textContent = p.o;
    el.children[2].textContent = ok ? "feito" : dd < 0 ? "passou" : dd === 0 ? "é hoje" : "faltam " + dd + " dias";
    box.appendChild(el);
  });
}

var abertas = null;
function renderCrono(){
  var box = document.getElementById("crono");
  if (abertas === null){
    abertas = {};
    var atual = SEMANAS.filter(function(s){ return soma(s.de, 6) >= HOJE; })[0] || SEMANAS[SEMANAS.length-1];
    abertas[atual.n] = true;
  }
  box.innerHTML = "";
  SEMANAS.forEach(function(s){
    var fim = soma(s.de, 6);
    var ts = TODAS.filter(function(t){ return t.sem === s.n; });
    var ok = ts.filter(function(t){ return feito(t.id); }).length;
    var det = document.createElement("details");
    det.className = "sem" + (HOJE >= s.de && HOJE <= fim ? " atual" : "");
    det.open = !!abertas[s.n];
    det.addEventListener("toggle", function(){ abertas[s.n] = det.open; });
    var sum = document.createElement("summary");
    sum.innerHTML = '<span class="num"></span><span class="tt"><b></b><span></span></span><span class="cont"></span>';
    sum.querySelector(".num").textContent = "S" + s.n;
    sum.querySelector("b").textContent = s.titulo;
    sum.querySelector(".tt span").textContent = curto(s.de) + " a " + curto(fim) + " · + inglês";
    var cont = sum.querySelector(".cont");
    cont.textContent = ok + "/" + ts.length;
    if (ok === ts.length) cont.className += " tudo";
    det.appendChild(sum);
    var corpo = document.createElement("div"); corpo.className = "corpo";
    ORDEM.forEach(function(d, k){
      var doDia = ts.filter(function(t){ return t.dia === d; });
      if (!doDia.length) return;
      var h = document.createElement("p"); h.className = "dia";
      h.textContent = NOME_DIA[d] + " · " + curto(soma(s.de, k));
      corpo.appendChild(h);
      var ul = document.createElement("ul"); ul.className = "ts";
      doDia.forEach(function(t){ ul.appendChild(linha(t, false)); });
      corpo.appendChild(ul);
    });
    det.appendChild(corpo);
    box.appendChild(det);
  });
}

function renderSalvo(){
  var el = document.getElementById("salvo");
  if (!estado.salvoEm){ el.textContent = "nada marcado ainda · fica salvo neste navegador"; return; }
  var d = new Date(estado.salvoEm);
  el.textContent = "salvo " + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") +
    " às " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function render(){ renderHoje(); renderPrazos(); renderCrono(); renderSalvo(); }

(function(){
  var d = new Date();
  document.getElementById("data").textContent =
    ["domingo","segunda","terça","quarta","quinta","sexta","sábado"][d.getDay()] + ", " + d.getDate() + " de " +
    ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][d.getMonth()];
})();

document.getElementById("btnBackup").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(estado, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "rotina-adrian-" + HOJE + ".json"; a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btnRestaurar").addEventListener("click", function(){ document.getElementById("fileRestaurar").click(); });
document.getElementById("fileRestaurar").addEventListener("change", function(ev){
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var novo = JSON.parse(r.result);
      if (novo && novo.feitos){ Object.keys(novo.feitos).forEach(function(k){ estado.feitos[k] = true; }); salvar(); render(); }
    } catch(e){}
  };
  r.readAsText(f);
});

render();
})();
</script>
</body>
</html>
