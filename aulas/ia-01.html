<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA Aula 01 — Um mergulho no passado</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101522'/%3E%3Cpath d='M12 10v12M20 10v12M12 16h8' stroke='%23F0B429' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0A0E1A; --bg2:#141B2E; --surface:#1B2338; --line:#2A3449;
    --ink:#F0F3FC; --ink-2:#A8B2C8; --ink-3:#6F7C96;
    --acc:#F0B429; --acc-2:#FFD56B; --azul:#6EA4FF; --vermelho:#FF6B6B;
    --display:Candara,Optima,"Segoe UI",system-ui,sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);height:100vh;overflow:hidden}

  .palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at top,#1A2238 0%,#0A0E1A 60%);overflow:hidden}

  /* HUD */
  .hud{position:fixed;left:0;right:0;bottom:0;padding:16px 20px;z-index:50;
    background:linear-gradient(to top,rgba(10,14,26,.92),rgba(10,14,26,0));backdrop-filter:blur(4px)}
  .hud .barra{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .hud .prog{height:100%;background:var(--acc);width:0;transition:width .2s linear}
  .hud .ctrl{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .hud button{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:9px 14px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px}
  .hud button:hover{background:var(--surface);border-color:var(--ink-3)}
  .hud button.primario{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
  .hud button.primario:hover{filter:brightness(1.08)}
  .hud .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
  .hud .meta b{color:var(--ink-2);font-weight:600}

  /* topo */
  .topo{position:fixed;top:0;left:0;right:0;padding:14px 20px;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to bottom,rgba(10,14,26,.9),rgba(10,14,26,0))}
  .topo a{color:var(--ink-3);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .topo a:hover{color:var(--ink)}
  .topo .titulo{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .topo .titulo b{color:var(--ink-2)}

  /* cena */
  .cena{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    padding:60px 24px;text-align:center;opacity:0;transition:opacity .4s}
  .cena.on{display:flex;opacity:1}
  .cena h1{font-family:var(--display);font-size:clamp(28px,5vw,52px);letter-spacing:-.02em;line-height:1.08;margin-bottom:18px;max-width:900px}
  .cena h2{font-family:var(--display);font-size:clamp(22px,3.6vw,36px);letter-spacing:-.01em;line-height:1.12;margin-bottom:14px;max-width:820px}
  .cena p{font-size:clamp(15px,1.8vw,19px);color:var(--ink-2);max-width:720px;line-height:1.55}
  .cena .ano{font-family:var(--mono);font-size:clamp(60px,10vw,120px);font-weight:700;color:var(--acc);letter-spacing:-.03em;line-height:1;margin-bottom:8px;text-shadow:0 0 40px rgba(240,180,41,.4)}
  .cena .selo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
  .cena strong{color:var(--ink)}

  /* animaçoes reutilizaveis */
  @keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes gira{to{transform:rotate(360deg)}}
  @keyframes neve{from{transform:translateY(-10vh)}to{transform:translateY(110vh)}}
  @keyframes risca{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
  @keyframes bate{0%,100%{transform:scale(1)}30%{transform:scale(1.2)}60%{transform:scale(.95)}}
  .cena.on h1,.cena.on h2,.cena.on p,.cena.on .ano,.cena.on .selo{animation:entra .6s both}
  .cena.on h2{animation-delay:.1s}
  .cena.on p{animation-delay:.3s}

  /* cenas especificas */
  .ilu{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,60px);margin:20px 0 10px;flex-wrap:wrap}
  .ilu .emj{font-size:clamp(50px,9vw,96px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));animation:pulsa 2.6s infinite}
  .ilu .seta{font-size:clamp(28px,5vw,48px);color:var(--acc)}
  .ilu .label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}

  /* timeline construindo */
  .timeline{position:relative;width:min(900px,92vw);margin:28px auto 10px;padding:14px 0}
  .timeline::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
  .tl-fill{position:absolute;left:0;top:50%;height:2px;background:var(--acc);transform:translateY(-50%);width:0;transition:width 1.4s ease-out}
  .tl-row{display:flex;justify-content:space-between;position:relative;z-index:2}
  .tl-pt{text-align:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
  .tl-pt.on{opacity:1;transform:translateY(0)}
  .tl-pt .bolinha{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);margin:0 auto 6px;box-shadow:0 0 0 4px rgba(240,180,41,.15)}
  .tl-pt .ano{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc);display:block}
  .tl-pt .evt{font-size:11px;color:var(--ink-2);display:block;margin-top:2px;max-width:110px}

  /* 3 colunas (abordagens ML) */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:820px;margin:14px auto 0}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:left;opacity:0;animation:entra .5s forwards}
  .col:nth-child(2){animation-delay:.2s} .col:nth-child(3){animation-delay:.4s}
  .col .n{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
  .col h3{font-family:var(--display);font-size:20px;margin:4px 0 6px}
  .col p{font-size:14px;color:var(--ink-2);text-align:left}

  /* cartoes de pessoa */
  .pessoa{display:inline-flex;flex-direction:column;align-items:center;margin:14px 10px 0}
  .pessoa .cara{width:clamp(90px,14vw,130px);height:clamp(90px,14vw,130px);border-radius:50%;background:linear-gradient(135deg,var(--surface),var(--bg2));
    display:flex;align-items:center;justify-content:center;font-size:clamp(46px,7vw,64px);border:2px solid var(--acc);
    box-shadow:0 0 30px rgba(240,180,41,.25)}
  .pessoa .nome{font-family:var(--mono);font-size:12px;color:var(--ink);margin-top:10px;letter-spacing:.06em}
  .pessoa .sub{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}

  /* teste de turing - balao */
  .balao{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;
    padding:12px 18px;margin:8px;color:var(--ink);font-size:14px;max-width:280px;text-align:left;position:relative;animation:entra .5s both}
  .balao.robo{border-color:var(--azul);color:var(--ink)}
  .balao.humano{border-color:var(--acc)}
  .balao::before{content:attr(data-de);position:absolute;top:-18px;left:4px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}

  /* inverno - flocos */
  .inverno{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .inverno .floco{position:absolute;top:-10vh;color:#fff;opacity:.6;font-size:14px;animation:neve linear infinite}
  .cena.inverno-cena{background:linear-gradient(180deg,#1A2545 0%,#0A0E1A 100%)}
  .cena.inverno-cena h1{color:#D0E4FF}

  /* eliza - terminal */
  .term{background:#0A1020;border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-width:520px;margin:14px auto 0;
    font-family:var(--mono);font-size:14px;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .term .ln{opacity:0;animation:entra .4s forwards}
  .term .ln.u{color:var(--acc-2)} .term .ln.e{color:var(--azul)}
  .term .cur{display:inline-block;width:8px;height:14px;background:var(--acc-2);vertical-align:-2px;animation:pulsa 1s infinite}

  @media (max-width:600px){
    .tl-pt .evt{font-size:10px;max-width:60px}
    .hud button{padding:7px 10px;font-size:11px}
  }
</style>
</head>

  <a href="../resumos/#ia/01">← voltar</a>

<script>
(function(){
"use strict";

/* cada cena: html + narracao (texto que a voz le) + duracao minima em ms (se voz falhar) */
var CENAS = [
  { html: `
    <span class="selo">Introdução à Inteligência Artificial</span>
    <h1>Aula 01<br>Um mergulho no passado</h1>
    <p>Prof. Leonam Nagel · aula de ~4 minutos</p>
    <div class="ilu" style="margin-top:28px">
      <span class="emj">🧠</span><span class="seta">→</span><span class="emj">🤖</span>
    </div>
  `, voz: "Introdução à Inteligência Artificial. Aula 1: Um mergulho no passado. Professor Leonam Nagel. Nessa aula a gente vai ver como a IA começou, desde o primeiro modelo matemático de neurônio até o inverno que parou tudo nos anos 70.", dur: 14000 },

  { html: `
    <span class="selo">Primeiro, o que é IA</span>
    <h2>IA é a simulação de processos de <strong>inteligência humana</strong> por uma máquina.</h2>
    <p>Ela nasceu do desejo humano de <strong>ir além da biologia</strong>. Pensa como extensão da evolução tecnológica: a gente quis replicar no silício o que o cérebro faz na carne.</p>
  `, voz: "Antes de mergulhar no passado, uma definição. Inteligência Artificial é a simulação de processos de inteligência humana por uma máquina. Ela nasceu do desejo humano de ir além da biologia.", dur: 11000 },

  { html: `
    <div class="ano">1943</div>
    <h2>O primeiro neurônio matemático</h2>
    <div class="ilu" style="margin:14px 0">
      <div class="pessoa"><div class="cara">👨‍🔬</div><span class="nome">Walter Pitts</span><span class="sub">matemático</span></div>
      <div class="pessoa"><div class="cara">👨‍⚕️</div><span class="nome">Warren McCulloch</span><span class="sub">neurologista</span></div>
    </div>
    <p>Eles criaram um <strong>modelo matemático</strong> que representava como um neurônio funciona. Parece pouco — mas essa é a base das <strong>redes neurais</strong> que rodam o ChatGPT hoje.</p>
  `, voz: "A nossa história começa em 1943. Dois pesquisadores, Walter Pitts e Warren McCulloch, criam o primeiro modelo matemático de um neurônio. Parece pouco, mas é a base das redes neurais que você usa hoje no ChatGPT.", dur: 13000 },

  { html: `
    <h2>Entre 1945 e 1948, duas peças entraram</h2>
    <div class="ilu" style="margin-top:20px">
      <div class="pessoa"><div class="cara">💻</div><span class="nome">1945</span><span class="sub">Computador moderno</span></div>
      <div class="pessoa"><div class="cara">📘</div><span class="nome">1948</span><span class="sub">Cibernética — N. Wiener</span></div>
    </div>
    <p>Em <strong>1945</strong> chega o computador moderno — sem hardware, IA não existe. Em <strong>1948</strong>, Norbert Wiener publica <em>Cibernética</em>, o primeiro livro sério sobre máquinas pensantes.</p>
  `, voz: "Em 1945 chega o computador moderno. Sem hardware, IA não existe. Em 1948, Norbert Wiener publica Cibernética, o primeiro livro sério sobre máquinas pensantes.", dur: 11000 },

  { html: `
    <div class="ano">1950</div>
    <h2>Alan Turing e <strong>a pergunta</strong></h2>
    <div class="ilu" style="margin:6px 0 10px">
      <div class="pessoa"><div class="cara">🧑‍🎓</div><span class="nome">Alan Turing</span><span class="sub">pai da computação</span></div>
    </div>
    <div style="display:flex;justify-content:center;flex-wrap:wrap">
      <div class="balao humano" data-de="Humano">Você é uma máquina?</div>
      <div class="balao robo" data-de="?">Não sei do que você fala.</div>
    </div>
    <p style="margin-top:14px">O <strong>Teste de Turing</strong>: se, numa conversa escrita, a pessoa não consegue dizer se tá falando com humano ou máquina, a máquina passou. <strong>64 anos depois</strong> alguém finalmente passou — em 2014.</p>
  `, voz: "1950. Alan Turing, o pai da computação, propõe uma pergunta simples: uma máquina consegue se passar por humano? Nasce o Teste de Turing. Levaria 64 anos pra alguém passar.", dur: 15000 },

  { html: `
    <div class="ano">1956</div>
    <h2>A certidão de nascimento da IA</h2>
    <p><strong>Conferência de Dartmouth.</strong> Um grupo de cientistas se reúne, e nessa conferência cunham oficialmente o termo: <strong>Inteligência Artificial</strong>.</p>
    <div style="margin-top:20px;padding:16px 24px;border:2px solid var(--acc);border-radius:12px;display:inline-block;background:rgba(240,180,41,.08)">
      <span style="font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--acc);text-transform:uppercase">Marco oficial</span>
      <div style="font-family:var(--display);font-size:clamp(22px,3vw,30px);margin-top:4px">“Inteligência Artificial” nasce como campo</div>
    </div>
  `, voz: "1956, Dartmouth College. Um grupo de cientistas se reúne e, nessa conferência, cunham oficialmente o termo Inteligência Artificial. É a certidão de nascimento da IA como campo de estudo.", dur: 13000 },

  { html: `
    <div class="ano">1959</div>
    <h2>Surge o <strong>Machine Learning</strong></h2>
    <p>Aprendizado de máquina. A ideia é simples: <strong>dar dados pra máquina</strong> e deixar ela encontrar os padrões sozinha, sem a gente programar regra por regra.</p>
    <div style="margin-top:20px;font-family:var(--mono);font-size:18px;color:var(--ink-2)">
      <span style="color:var(--acc)">dados</span> → máquina → <span style="color:var(--acc)">padrão aprendido</span>
    </div>
    <p style="margin-top:14px;font-size:14px;color:var(--ink-3)">Dados são o <strong>alimento</strong> da IA.</p>
  `, voz: "Três anos depois, em 1959, surge outro termo que você vai ouvir muito: Machine Learning, ou aprendizado de máquina. A ideia é dar dados pra máquina e deixar ela encontrar os padrões sozinha.", dur: 12000 },

  { html: `
    <h2>As <strong>3 abordagens</strong> do Machine Learning</h2>
    <p style="font-size:14px;color:var(--ink-3);margin-bottom:6px">(decora essa — cai em prova)</p>
    <div class="cols">
      <div class="col"><span class="n">01</span><h3>Simbólica</h3><p>Regras lógicas. <em>Se X então Y.</em> Pensamento de advogado.</p></div>
      <div class="col"><span class="n">02</span><h3>Conexionista</h3><p>Redes neurais. Imita o cérebro humano. É o que roda hoje.</p></div>
      <div class="col"><span class="n">03</span><h3>Evolutiva</h3><p>Algoritmos genéticos. Simula a evolução biológica — o mais apto sobrevive.</p></div>
    </div>
  `, voz: "O machine learning se divide em três escolas de pensamento. Simbólica, usa regras lógicas: se X então Y. Conexionista, imita o cérebro com redes neurais, é o que roda hoje. E evolutiva, baseada na teoria da evolução.", dur: 14000 },

  { html: `
    <span class="selo">Anos 60</span>
    <h2>John McCarthy e a <strong>linguagem Lisp</strong></h2>
    <div class="ilu">
      <div class="pessoa"><div class="cara">👨‍💻</div><span class="nome">John McCarthy</span><span class="sub">o padrinho da IA</span></div>
    </div>
    <p>Ele criou o <strong>Lisp</strong>, a primeira linguagem de programação pensada pra IA. Com ela, finalmente os robôs começaram a <strong>conversar</strong>.</p>
  `, voz: "Anos 60. John McCarthy, considerado o padrinho da IA, cria a linguagem Lisp. A primeira linguagem pensada pra inteligência artificial. Robôs começam a conversar.", dur: 10000 },

  { html: `
    <div class="ano">1966</div>
    <h2>ELIZA — <strong>o primeiro chatbot</strong></h2>
    <p>Joseph Weizenbaum cria ELIZA, que simulava um <strong>psicanalista</strong>. Era só script pré-programado — mas assustou o mundo.</p>
    <div class="term">
      <div class="ln u">&gt; Tô meio triste hoje.</div>
      <div class="ln e" style="animation-delay:.3s">ELIZA: Por que você tá meio triste hoje?</div>
      <div class="ln u" style="animation-delay:.9s">&gt; Acho que é por causa do trabalho.</div>
      <div class="ln e" style="animation-delay:1.5s">ELIZA: Me conta mais sobre o seu trabalho.<span class="cur"></span></div>
    </div>
    <p style="margin-top:14px;font-size:14px;color:var(--ink-3)">Muita gente confessava segredos pra ela. Só que por dentro: era um <em>if/else</em>.</p>
  `, voz: "1966. Joseph Weizenbaum cria ELIZA, o primeiro chatbot da história. Simulava um psicanalista. Era só script pré-programado, mas assustou o mundo. Muita gente confessava segredos pra ela.", dur: 16000 },

  { html: `
    <span class="selo">Décadas de 1960 e 70</span>
    <h2>Robôs humanoides e o termo <strong>“ciborgue”</strong></h2>
    <div class="ilu">
      <div class="pessoa"><div class="cara">🤖</div><span class="nome">Wabot-1</span><span class="sub">1973 · Japão</span></div>
      <div class="pessoa"><div class="cara">🎹</div><span class="nome">Wabot-2</span><span class="sub">1980 · tocava piano</span></div>
    </div>
    <p>O Japão cria os <strong>Wabot-1 e Wabot-2</strong>, os primeiros robôs humanoides capazes de fazer tarefas. Nessa época surge o termo <strong>ciborgue</strong>.</p>
  `, voz: "Nos anos 60 e 70, o Japão cria os Wabot-1 e Wabot-2, os primeiros robôs humanoides. O Wabot-2 chegou a tocar piano. Nasce o termo ciborgue.", dur: 11000 },

  { html: `
    <div class="inverno" id="floco-pai"></div>
    <div class="ano" style="color:#D0E4FF;text-shadow:0 0 40px rgba(208,228,255,.5)">❄️</div>
    <h1 style="color:#D0E4FF">O Inverno da IA</h1>
    <p style="color:#B8CBE8">Entre o <strong>final dos anos 60</strong> e o <strong>início dos 90</strong>, duas vezes a IA ficou congelada. Os computadores eram fracos demais, as promessas eram grandes demais. O dinheiro secou.</p>
    <div style="display:flex;gap:30px;margin-top:20px;flex-wrap:wrap;justify-content:center">
      <div><div style="font-family:var(--mono);font-size:24px;color:#D0E4FF">1º inverno</div><div style="color:#B8CBE8;font-size:13px">fim dos 60 / início dos 70</div></div>
      <div><div style="font-family:var(--mono);font-size:24px;color:#D0E4FF">2º inverno</div><div style="color:#B8CBE8;font-size:13px">anos 80 / início dos 90</div></div>
    </div>
  `, voz: "E então veio o inverno. Duas vezes. No final dos anos 60 e nos anos 80, o dinheiro secou. Os computadores eram fracos demais, as promessas eram grandes demais. A IA ficou congelada por quase vinte anos.", classe:"inverno-cena", dur: 15000 },

  { html: `
    <span class="selo">Recapitulando</span>
    <h2>A linha do tempo que você acabou de ver</h2>
    <div class="timeline">
      <div class="tl-fill" id="tlFill"></div>
      <div class="tl-row">

var palco = document.getElementById("palco");
var i = 0, tocando = false, timer = null, inicio = 0, acumulado = 0;
var synth = window.speechSynthesis, uter = null, vozPtBr = null;

function escolherVoz(){
  var vs = synth.getVoices();
  vozPtBr = vs.find(function(v){ return /pt.?BR/i.test(v.lang); })
         || vs.find(function(v){ return /^pt/i.test(v.lang); })
         || vs[0];
  document.getElementById("voz").textContent = "voz: " + (vozPtBr ? vozPtBr.name.substring(0,22) : "indisponível");
}
if (synth){
  escolherVoz();
  synth.onvoiceschanged = escolherVoz;
}

function montar(n){
  i = Math.max(0, Math.min(CENAS.length - 1, n));
  palco.innerHTML = "";
  var cena = CENAS[i];
  var d = document.createElement("div");
  d.className = "cena" + (cena.classe ? " " + cena.classe : "");
  d.innerHTML = cena.html;
  palco.appendChild(d);
  requestAnimationFrame(function(){ d.classList.add("on"); });
  if (cena.classe === "inverno-cena"){ gerarNeve(d); }
  if (cena.aposMontar) cena.aposMontar(d);
  document.getElementById("nCena").textContent = i + 1;
  document.getElementById("totalCenas").textContent = CENAS.length;
  atualizarProg(0);
}

function gerarNeve(el){
  var pai = el.querySelector("#floco-pai"); if (!pai) return;
  var simbolos = ["❄","✦","·"];
  for (var k = 0; k < 40; k++){
    var f = document.createElement("span");
    f.className = "floco"; f.textContent = simbolos[k % 3];
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = (8 + Math.random() * 14) + "px";
    f.style.animationDuration = (5 + Math.random() * 7) + "s";
    f.style.animationDelay = (-Math.random() * 7) + "s";
    f.style.opacity = (.3 + Math.random() * .5);
    pai.appendChild(f);
  }
}

function narrar(cena, aoAcabar){
  if (!synth){ setTimeout(aoAcabar, cena.dur); return null; }
  try { synth.cancel(); } catch(e){}
  uter = new SpeechSynthesisUtterance(cena.voz);
  if (vozPtBr) uter.voice = vozPtBr;
  uter.lang = "pt-BR"; uter.rate = 1.05; uter.pitch = 1;
  uter.onend = function(){ aoAcabar(); };
  uter.onerror = function(){ setTimeout(aoAcabar, Math.max(1000, cena.dur - 2000)); };
  var fallback = setTimeout(aoAcabar, cena.dur + 4000);
  var original = aoAcabar;
  aoAcabar = function(){ clearTimeout(fallback); original(); };
  uter.onend = aoAcabar;
  synth.speak(uter);
  return uter;
}

function atualizarProg(pct){
  document.getElementById("prog").style.width = (((i + pct) / CENAS.length) * 100) + "%";
  var totalMs = CENAS.reduce(function(a, c){ return a + c.dur; }, 0);
  var passadoMs = 0;
  for (var k = 0; k < i; k++) passadoMs += CENAS[k].dur;
  passadoMs += CENAS[i].dur * pct;
  var s = Math.floor(passadoMs / 1000);
  document.getElementById("relogio").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2,"0");
}

function tocarCenaAtual(){
  var cena = CENAS[i];
  inicio = Date.now(); acumulado = 0;
  var dur = cena.dur;
  function tick(){
    if (!tocando) return;
    var p = Math.min(1, (Date.now() - inicio + acumulado) / dur);
    atualizarProg(p);
    if (p < 1) timer = requestAnimationFrame(tick);
  }
  tick();
  narrar(cena, function(){
    if (!tocando) return;
    if (i < CENAS.length - 1){ i++; montar(i); tocarCenaAtual(); }
    else { pausar(); document.getElementById("btnPlay").textContent = "↻ Rever"; }
  });
}

function tocar(){
  if (tocando) return;
  tocando = true;
  document.getElementById("btnPlay").textContent = "⏸ Pausar";
  if (synth) { try { synth.resume(); } catch(e){} }
  tocarCenaAtual();
}
function pausar(){
  tocando = false;
  document.getElementById("btnPlay").textContent = "▶ Continuar";
  cancelAnimationFrame(timer);
  if (synth) { try { synth.pause(); } catch(e){} }
}

document.getElementById("btnPlay").addEventListener("click", function(){
  if (i === CENAS.length - 1 && !tocando){ i = 0; montar(0); tocar(); return; }
  if (tocando) pausar(); else tocar();
});
document.getElementById("btnAvancar").addEventListener("click", function(){
  if (i < CENAS.length - 1){ i++; montar(i); if (tocando){ synth && synth.cancel(); tocarCenaAtual(); } }
});
document.getElementById("btnVoltar").addEventListener("click", function(){
  if (i > 0){ i--; montar(i); if (tocando){ synth && synth.cancel(); tocarCenaAtual(); } }
});

document.addEventListener("keydown", function(e){
  if (e.code === "Space"){ e.preventDefault(); document.getElementById("btnPlay").click(); }
  else if (e.code === "ArrowRight"){ document.getElementById("btnAvancar").click(); }
  else if (e.code === "ArrowLeft"){ document.getElementById("btnVoltar").click(); }
});

montar(0);
})();
</script>
